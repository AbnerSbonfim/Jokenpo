<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
      <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=N63IU8fkvjMj&format=png&color=000000">
    <title>Jokenpô</title>
</head>

<body>
<body>
    <div class="bg-wrapper">
        <div class="bg-spinner">
            <img src="assets/jokenpô.png" alt="Fundo decorativo girando" class="bg-rotate">
        </div>
    </div>

    <div class="floating-icons">
        <span class="icon">🪨</span>
        <span class="icon">📄</span>
        <span class="icon">✂️</span>
        <span class="icon">🪨</span>
        <span class="icon">📄</span>
        <span class="icon">✂️</span>
    </div>

    <div class="container">
        <h1>Jokenpô</h1>

        <div class="buttons">
            <button onclick="playHuman('rock')" id="Rock">&#9994</button>
            <button onclick="playHuman('paper')" id="Paper">&#128400</button>
            <button onclick="playHuman('scissors')" id="Scissors">&#9996</button>
        </div>
        <p class="result"></p>

        <p class="your-score">Minha Pontuação: <span id="human-score">0</span></p>

        <p class="ia-score">Pontuação da IA: <span id="machine-score">0</span></p>


         <p class="empates">Empates: <span id="draws-score">0</span></p>
    </div>
    
     <script src="scripts.js"></script>
</body>
   
</html>
